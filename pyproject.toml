[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnbc-biomarkers"
version = "1.1.0"
description = "TNBC versus non-TNBC transcriptomic biomarker analysis of GEO GSE76275"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ishitta Sarkar" }]
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "requests==2.34.2",
]

[project.scripts]
tnbc-biomarkers = "tnbc_biomarkers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/tnbc_biomarkers/reporting.py" = ["E501"]
